*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f1f6fc;color:#183550;font:400 16px/1.6 "Linkincrease Deck Sans";font-synthesis:none}
main{width:min(100%,430px);padding:clamp(24px,6vw,44px);background:white;border:1px solid #d8e5f5;border-radius:18px;box-shadow:0 20px 60px #23456a0f}
.brand{font-size:17px;font-weight:740;color:#2565c9;margin:0 0 20px}
h1{font-size:28px;line-height:1.35;margin:0 0 24px}
label{display:block;font-size:14px;margin-bottom:8px}
input,button{width:100%;min-height:46px;border-radius:8px;font:inherit}
input{padding:10px 12px;border:1px solid #bdcfe3;color:inherit;background:white}
button{margin-top:14px;border:0;background:#2565c9;color:white;font-weight:650;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
:focus-visible{outline:2px solid #2565c9;outline-offset:3px}
#status{min-height:1.6em;font-size:13px;color:#4a6079;margin:12px 0 0}
</style>
</head>
<body>
<main>
  <p class="brand">Linkincrease</p>
  <h1>演示入口</h1>
  <form id="unlock">
    <label for="password">访问密码</label>
    <input id="password" type="password" required maxlength="256" autocomplete="off" enterkeyhint="go">
    <button type="submit">进入演示</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <noscript>请开启 JavaScript 后重新访问。</noscript>
</main>
<script>
'use strict';
(() => {
const form = document.getElementById('unlock');
const input = document.getElementById('password');
const button = form.querySelector('button');
const status = document.getElementById('status');
const magic = 'LIPRES01';
let payloadPromise;

function loadPayload() {
  return fetch('./presentation.bin', { cache: 'no-cache' }).then(async response => {
    if (!response.ok) throw new Error('payload');
    const bytes = new Uint8Array(await response.arrayBuffer());
    if (bytes.length < 52 || new TextDecoder().decode(bytes.subarray(0, 8)) !== magic) {
      throw new Error('payload');
    }
    return bytes;
  });
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (button.disabled) return;
  if (!globalThis.crypto?.subtle || !globalThis.DecompressionStream) {
    status.textContent = '请使用新版 Chrome、Edge、Firefox 或 Safari。';
    return;
  }
  button.disabled = true;
  status.textContent = '正在打开演稿…';
  const passwordBytes = new TextEncoder().encode(input.value);
  input.value = '';
  try {
    const bytes = await (payloadPromise ||= loadPayload().catch(error => {
      payloadPromise = undefined;
      throw error;
    }));
    const material = await crypto.subtle.importKey('raw', passwordBytes, 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({
      name: 'PBKDF2', hash: 'SHA-256', salt: bytes.subarray(8, 24), iterations: 1000000,
    }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    let compressed;
    try {
      compressed = await crypto.subtle.decrypt({
        name: 'AES-GCM', iv: bytes.subarray(24, 36), additionalData: bytes.subarray(0, 8),
      }, key, bytes.subarray(36));
    } catch {
      status.textContent = '密码不正确，请重试。';
      input.focus();
      return;
    }
    const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const presentation = await new Response(stream).text();
    document.open();
    document.write(presentation);
    document.close();
  } catch {
    status.textContent = '暂时无法加载演稿，请刷新后重试。';
  } finally {
    passwordBytes.fill(0);
    button.disabled = false;
  }
});
})();
</script>
</body>
</html>
